const slug=new URLSearchParams(location.search).get('project'),p=PORTFOLIO_PROJECTS.find(x=>x.slug===slug)||PORTFOLIO_PROJECTS[0],steps=p.approach||[],decisions=p.decisions||[];

const flowByProject={alstone:[['Entry','Brand and product overview'],['Browse','Materials and categories'],['Evaluate','Product details and specifications'],['Act','Enquiry or dealer contact']],prayag:[['Entry','Brand and category overview'],['Browse','Bathroom and plumbing ranges'],['Evaluate','Product details and context'],['Act','Dealer or contact route']],basiq360:[['Entry','Secure sign-in'],['Orient','Dashboard and priorities'],['Manage','Leads and activities'],['Act','Follow-up and status']], 'highway-roop':[['Entry','Company overview'],['Explore','Capabilities and businesses'],['Evaluate','Technical and global context'],['Act','Business enquiry']]};

<section class="case-section case-alt"><div class="case-shell">${intro('03','The challenge','The problem behind the interface.')}<div class="challenge-display section-reveal"><span>Core challenge</span><p>${p.challenge||'The experience needed clearer hierarchy, stronger responsive consistency and more direct guidance through important content and tasks.'}</p></div></div></section>
<section class="case-section"><div class="case-shell">${intro('04','My role','Working across structure, interface and delivery.')}<div class="role-board"><article class="section-reveal"><span>Role</span><h3>${p.role}</h3></article><article class="section-reveal"><span>Responsibilities</span><p>${steps.slice(0,4).join(' · ')||'Experience review · Interface design · Responsive patterns · Developer handoff'}</p></article><article class="section-reveal"><span>Tools</span><p>Figma · FigJam · Miro · Photoshop · Illustrator · Codex</p></article></div></div></section>

const reveal=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');reveal.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -5%'});document.querySelectorAll('.section-reveal').forEach(el=>reveal.observe(el));const header=document.querySelector('.site-header'),menu=document.querySelector('.menu-button');if(menu)menu.addEventListener('click',()=>header.classList.toggle('menu-open'));const caseYear=document.querySelector('#case-year');if(caseYear)caseYear.textContent=new Date().getFullYear();
